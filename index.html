<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虹桥枢纽交通方式对比工具 · 优化步行时间估算</title>
    
    <!-- 高德地图 JS API v2 (只保留必要插件) -->
    <script src="https://webapi.amap.com/maps?v=2.0&key=15b581287108b2ce589abef0697aaa37&plugin=AMap.Geocoder,AMap.ToolBar,AMap.Scale"></script>
    
    <style>
        /* 样式与之前完全相同，此处省略以节省篇幅，实际使用时请保留完整样式 */
        * { box-sizing: border-box; }
        body { 
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif; 
            max-width: 1400px; 
            margin: 0 auto; 
            padding: 20px; 
            line-height: 1.6; 
            background-color: #f8f9fa;
        }
        .container { 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        h1 { 
            color: #007bff; 
            margin-bottom: 5px; 
            font-size: 32px;
        }
        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .input-section { 
            display: grid; 
            grid-template-columns: 1fr 1fr auto; 
            gap: 20px; 
            margin-bottom: 15px;
        }
        .input-group { 
            display: flex;
            flex-direction: column;
        }
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: bold; 
            color: #333; 
            font-size: 15px;
        }
        input, select { 
            width: 100%; 
            padding: 14px 16px; 
            margin: 5px 0; 
            border: 2px solid #e0e0e0; 
            border-radius: 8px; 
            font-size: 16px; 
            transition: all 0.3s;
            background-color: white;
        }
        input:focus, select:focus { 
            border-color: #007bff; 
            outline: none; 
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1); 
        }
        input[readonly] { 
            background-color: #f8f9fa; 
            color: #666;
            cursor: not-allowed;
        }
        button { 
            padding: 14px 28px; 
            background: linear-gradient(135deg, #007bff, #0056b3); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 600; 
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: fit-content;
            align-self: flex-end;
        }
        button:hover { 
            background: linear-gradient(135deg, #0056b3, #004494); 
            transform: translateY(-2px); 
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.3); 
        }
        .direction-selector {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            background: #f0f7ff;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #cce5ff;
        }
        .direction-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .direction-option input[type="radio"] {
            width: auto;
            margin: 0;
        }
        .map-container { 
            height: 450px; 
            border: 2px solid #e0e0e0; 
            border-radius: 10px; 
            overflow: hidden; 
            position: relative; 
            background: #f9f9f9;
        }
        .map-tip {
            position: absolute; 
            bottom: 15px; 
            left: 15px; 
            background: rgba(255, 255, 255, 0.95); 
            padding: 10px 20px; 
            border-radius: 30px; 
            font-size: 13px; 
            z-index: 800; 
            box-shadow: 0 3px 12px rgba(0,0,0,0.15); 
            border-left: 4px solid #007bff;
            pointer-events: none;
        }
        .destination-select { 
            display: flex; 
            gap: 15px; 
            margin-top: 10px;
        }
        .destination-option {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .destination-option.active {
            border-color: #007bff;
            background-color: #f0f7ff;
        }
        .results-table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 25px; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
        }
        .results-table th { 
            background: linear-gradient(135deg, #007bff, #0056b3); 
            color: white; 
            font-weight: 600; 
            font-size: 15px;
            padding: 18px 12px;
            text-align: center;
            white-space: nowrap;
        }
        .results-table td { 
            border: 1px solid #e0e0e0; 
            padding: 16px 12px; 
            text-align: center; 
        }
        .results-table tr:nth-child(even) { background-color: #f8f9fa; }
        .transport-icon { 
            font-size: 1.5em; 
            margin-right: 8px; 
            display: inline-block;
        }
        .loading { 
            color: #666; 
            font-style: italic; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 12px; 
            padding: 50px;
        }
        .spinner { 
            border: 4px solid #f3f3f3; 
            border-top: 4px solid #007bff; 
            border-radius: 50%; 
            width: 30px; 
            height: 30px; 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
        .api-info { 
            background: linear-gradient(135deg, #fff3cd, #ffeaa7); 
            padding: 15px 20px; 
            border-radius: 8px; 
            margin: 15px 0;
            border-left: 5px solid #ffc107;
            font-size: 14px;
        }
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            padding: 3px 8px;
            border-radius: 12px;
            background: #f8f9fa;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-success { background: #28a745; }
        .status-info { background: #007bff; }
        .status-error { background: #dc3545; }
        @media (max-width: 1100px) {
            .input-section { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>虹桥枢纽交通方式对比分析工具</h1>
    <p class="subtitle">点击地图选择<strong>起点</strong>（蓝标）— 终点红标+连线</p>
    
    <div class="status-indicator" style="margin-bottom: 15px;">
        <span id="status-dot" class="status-dot status-info"></span>
        <span id="status-text">等待连接</span>
    </div>
    
    <div class="input-section">
        <div class="input-group">
            <label for="start">📍 起点位置 (点击地图选择)</label>
            <input type="text" id="start" placeholder="点击地图自动填充" value="" readonly>
            <div class="time-input" style="margin-top: 15px;">
                <label for="departure-time">⏰ 出发时刻</label>
                <input type="time" id="departure-time" value="08:00">
            </div>
        </div>
        <div class="input-group">
            <label>🏁 终点 (虹桥枢纽)</label>
            <div class="destination-select">
                <div id="destination-airport" class="destination-option active" onclick="selectDestination('airport')">
                    <input type="radio" name="destination" value="airport" checked style="width: auto;"> 上海虹桥机场
                </div>
                <div id="destination-railway" class="destination-option" onclick="selectDestination('railway')">
                    <input type="radio" name="destination" value="railway" style="width: auto;"> 上海虹桥火车站
                </div>
            </div>
            <!-- 方向选择 -->
            <div class="direction-selector">
                <div class="direction-option">
                    <input type="radio" name="trip-direction" id="dir-to-hub" value="to-hub" checked>
                    <label for="dir-to-hub" style="margin-bottom: 0;">进站 (出发地 → 虹桥枢纽)</label>
                </div>
                <div class="direction-option">
                    <input type="radio" name="trip-direction" id="dir-from-hub" value="from-hub">
                    <label for="dir-from-hub" style="margin-bottom: 0;">离站 (虹桥枢纽 → 目的地)</label>
                </div>
            </div>
        </div>
        <button id="calculate-btn" onclick="calculate()">
            <span>🚀</span><span>开始计算对比</span>
        </button>
    </div>
    
    <div class="api-info">
        <strong>🔧 本次优化：</strong> 修复乘车时间异常；改进步行距离估算（API失败时采用更合理系数），避免大量60分钟；已移除定位搜索功能。
    </div>
    
    <!-- 地图区域 (无搜索栏) -->
    <div id="map" class="map-container">
        <div class="map-tip">🗺️ 点击地图设置起点 | 红点为虹桥枢纽</div>
    </div>
    
    <!-- 结果表格 -->
    <div id="results">
        <h2 style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
            <span>📊 交通方式对比结果</span>
            <span style="font-size: 14px; font-weight: normal; color: #666;">（所有9种方式均显示，进/离站数据不同）</span>
        </h2>
        <table class="results-table">
            <thead>
                <tr>
                    <th>交通方式</th>
                    <th>候车时间</th>
                    <th>出发点到上车点/<br>下车点到目的地的步行时间</th>
                    <th>车内乘车时间</th>
                    <th>换乘次数</th>
                    <th>费用估算</th>
                </tr>
            </thead>
            <tbody id="results-body">
                <tr><td colspan="6" class="loading"><div class="spinner"></div><div>请点击地图选择起点后点击"开始计算对比"</div></td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // ==================== 配置 & 全局变量 ====================
    const AMAP_WEB_SERVICE_KEY = "37066b3c0ab22ef0777a488af2c83b1d";
    
    let map = null;
    let geocoder = null;
    
    let currentStartLngLat = null;
    const destinations = {
        airport: { name: "上海虹桥机场", coords: [121.327, 31.195] },
        railway: { name: "上海虹桥火车站", coords: [121.320, 31.194] }
    };
    let currentDestination = 'airport';
    let currentEndLngLat = destinations.airport.coords;
    
    let isCalculating = false;
    let lastSuccessfulAPIResponse = { driving: null, transit: null };
    let startMarker = null;
    let endMarker = null;
    let polyline = null;
    
    // 缓存外部点坐标及其对应的步行距离（用于进/离站对称）
    let lastExternalLngLat = null;
    let lastMetroWalkDist = 0;
    let lastBusWalkDist = 0;
    
    // ==================== 状态提示 ====================
    function updateStatus(message, type = 'info') {
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');
        if (statusText) statusText.textContent = message;
        if (statusDot) {
            statusDot.className = 'status-dot';
            statusDot.classList.add(`status-${type}`);
        }
        console.log(`[状态] ${message}`);
    }
    
    // ==================== 获取当前方向 ====================
    function getTripDirection() {
        const radios = document.getElementsByName('trip-direction');
        for (let radio of radios) {
            if (radio.checked) return radio.value;
        }
        return 'to-hub';
    }
    
    // ==================== 目的地选择 ====================
    window.selectDestination = function(type) {
        currentDestination = type;
        currentEndLngLat = destinations[type].coords;
        document.querySelectorAll('.destination-option').forEach(opt => opt.classList.remove('active'));
        document.getElementById(`destination-${type}`).classList.add('active');
        if (map) {
            updateMapMarkers();
            if (currentStartLngLat) setTimeout(() => calculate(), 300);
        }
    };
    
    // ==================== 统一更新地图标记 ====================
    function updateMapMarkers() {
        if (!map) return;
        if (startMarker) startMarker.setMap(null);
        if (endMarker) endMarker.setMap(null);
        if (polyline) polyline.setMap(null);
        
        endMarker = new AMap.Marker({
            position: currentEndLngLat,
            map: map,
            content: '<div style="background: #dc3545; color: white; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; border: 2px solid white; box-shadow: 0 3px 10px rgba(0,0,0,0.3);">终</div>',
            zIndex: 100
        });
        
        if (currentStartLngLat) {
            startMarker = new AMap.Marker({
                position: currentStartLngLat,
                map: map,
                content: '<div style="background: #007bff; color: white; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; border: 2px solid white; box-shadow: 0 3px 10px rgba(0,0,0,0.3);">起</div>',
                zIndex: 200
            });
            
            polyline = new AMap.Polyline({
                path: [currentStartLngLat, currentEndLngLat],
                strokeColor: "#007bff", 
                strokeWeight: 5, 
                strokeOpacity: 0.7,
                lineJoin: 'round',
                map: map
            });
            map.setFitView([startMarker, endMarker]);
        }
    }
    
    // ==================== 地图初始化 ====================
    function initMap() {
        if (typeof AMap === 'undefined') { updateStatus('高德API加载失败', 'error'); return; }
        try {
            map = new AMap.Map('map', { zoom: 11, center: [121.3, 31.2], viewMode: '2D' });
            geocoder = new AMap.Geocoder({ city: "上海", radius: 1000 });
            map.addControl(new AMap.ToolBar());
            map.addControl(new AMap.Scale());
            
            updateMapMarkers();
            map.on('click', function(e) { handleMapClick(e.lnglat); });
            
            updateStatus('地图就绪，点击选择起点', 'success');
        } catch (e) {
            console.error('地图初始化异常:', e);
            updateStatus('地图初始化失败', 'error');
        }
    }
    
    // ==================== 地图点击处理 ====================
    function handleMapClick(lnglat) {
        currentStartLngLat = [lnglat.lng, lnglat.lat];
        document.getElementById('start').value = '获取地址中...';
        
        if (geocoder) {
            geocoder.getAddress([lnglat.lng, lnglat.lat], function(status, result) {
                if (status === 'complete' && result.info === 'OK') {
                    let addr = result.regeocode.formattedAddress;
                    document.getElementById('start').value = addr.length > 30 ? addr.substring(0,27)+'...' : addr;
                } else {
                    document.getElementById('start').value = lnglat.lng.toFixed(6)+', '+lnglat.lat.toFixed(6);
                }
                updateMapMarkers();
                setTimeout(() => calculate(), 300);
            });
        }
    }
    
    // ========== 高德API调用 ==========
    async function callAmapAPI(apiType, params) {
        const baseURL = 'https://restapi.amap.com/v3/direction/';
        let url = '';
        if (apiType === 'driving') {
            url = `${baseURL}driving?origin=${params.start[0]},${params.start[1]}&destination=${params.end[0]},${params.end[1]}&key=${AMAP_WEB_SERVICE_KEY}&strategy=0`;
        } else if (apiType === 'transit') {
            url = `${baseURL}transit/integrated?origin=${params.start[0]},${params.start[1]}&destination=${params.end[0]},${params.end[1]}&key=${AMAP_WEB_SERVICE_KEY}&city=上海&strategy=0&extensions=all`;
        }
        try {
            const resp = await fetch(url);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            if (data.status === "1") {
                lastSuccessfulAPIResponse[apiType] = data;
                return { success: true, data };
            } else {
                if (lastSuccessfulAPIResponse[apiType]) return { success: true, data: lastSuccessfulAPIResponse[apiType], fromCache: true };
                return { success: false, error: data.info };
            }
        } catch (e) {
            if (lastSuccessfulAPIResponse[apiType]) return { success: true, data: lastSuccessfulAPIResponse[apiType], fromCache: true };
            return { success: false, error: e.message };
        }
    }
    
    // ========== 上海地铁阶梯票价 ==========
    function getMetroPriceByDistance(distanceKm) {
        if (distanceKm <= 6) return 3;
        if (distanceKm <= 16) return 4;
        if (distanceKm <= 26) return 5;
        if (distanceKm <= 36) return 6;
        if (distanceKm <= 46) return 7;
        if (distanceKm <= 56) return 8;
        if (distanceKm <= 66) return 9;
        return 10;
    }
    
    // ========== 共享单车计费 ==========
    function calculateBikePrice(ridingDistanceKm) {
        if (ridingDistanceKm <= 0 || ridingDistanceKm > 8) return '-';
        const minutes = Math.ceil(ridingDistanceKm * 4);
        if (minutes <= 15) return 1.5;
        const extra = Math.ceil((minutes - 15) / 15);
        return (1.5 + extra).toFixed(1);
    }
    
    // ========== 出租车计费 ==========
    function calculateTaxiPrice(distanceKm, hour) {
        let cost = 14;
        if (distanceKm > 3) cost += (Math.min(distanceKm, 15) - 3) * 2.5;
        if (distanceKm > 15) cost += (distanceKm - 15) * 3.6;
        if ((hour >= 7 && hour < 9) || (hour >= 17 && hour < 19)) cost *= 1.2;
        return Math.round(cost);
    }
    
    // ========== 辅助函数：判断是否为纯模式方案 ==========
    function isPureModeTransit(transit, mode) {
        if (!transit.segments) return false;
        for (let seg of transit.segments) {
            if (seg.walking || seg.bike) continue;
            if (mode === 'bus' && !seg.bus) return false;
            if (mode === 'railway' && !seg.railway) return false;
        }
        return true;
    }
    
    // ========== 从 transits 中获取时间最短的纯方案 ==========
    function findBestPureTransit(transits, mode) {
        const pureTransits = transits.filter(t => isPureModeTransit(t, mode));
        if (pureTransits.length === 0) return null;
        return pureTransits.reduce((best, t) => (t.duration < best.duration) ? t : best);
    }
    
    // ========== 从混合方案中提取指定模式的纯信息 ==========
    function extractModeInfo(transit, mode) {
        let rideSeconds = 0;
        let firstWalk = 0;
        let lastWalk = 0;
        let internalTransfers = 0;
        let totalCost = 0;
    
        const segments = transit.segments || [];
        const modeIndices = [];
        segments.forEach((seg, idx) => {
            if (mode === 'bus' && seg.bus) modeIndices.push(idx);
            if (mode === 'railway' && seg.railway) modeIndices.push(idx);
        });
        if (modeIndices.length === 0) return null;
    
        for (let i = 0; i < modeIndices[0]; i++) {
            const seg = segments[i];
            if (seg.walking) firstWalk += seg.walking.distance || 0;
        }
    
        for (let i = modeIndices[modeIndices.length-1] + 1; i < segments.length; i++) {
            const seg = segments[i];
            if (seg.walking) lastWalk += seg.walking.distance || 0;
        }
    
        for (let i = 0; i < modeIndices.length; i++) {
            const idx = modeIndices[i];
            const seg = segments[idx];
    
            if (mode === 'bus' && seg.bus && seg.bus.buslines && seg.bus.buslines.length > 0) {
                const line = seg.bus.buslines[0];
                const dur = line.duration || 0;
                if (dur > 0 && dur < 86400) {
                    rideSeconds += dur;
                } else {
                    const dist = line.distance || 0;
                    if (dist > 0) rideSeconds += (dist / 1000) * 240;
                }
                if (line.price) totalCost += parseFloat(line.price) || 0;
            } else if (mode === 'railway' && seg.railway) {
                const dur = seg.railway.duration || 0;
                if (dur > 0 && dur < 86400) {
                    rideSeconds += dur;
                } else {
                    const dist = seg.railway.distance || 0;
                    if (dist > 0) rideSeconds += (dist / 1000) * 120;
                }
            }
    
            if (i > 0) {
                let hasOtherMode = false;
                for (let j = modeIndices[i-1] + 1; j < idx; j++) {
                    const between = segments[j];
                    if (between.bus || between.railway || between.taxi) {
                        hasOtherMode = true;
                        break;
                    }
                }
                if (!hasOtherMode) internalTransfers++;
            }
        }
    
        if (mode === 'bus' && totalCost === 0) {
            totalCost = modeIndices.length * 2;
        }
    
        return {
            rideMinutes: Math.round(rideSeconds / 60),
            firstWalk: Math.round(firstWalk),
            lastWalk: Math.round(lastWalk),
            transfers: internalTransfers,
            cost: totalCost
        };
    }
    
    function selectBestTransitByMode(transits, mode) {
        let best = null;
        let bestDuration = Infinity;
        for (let transit of transits) {
            if (!transit.segments) continue;
            let hasMode = false;
            for (let seg of transit.segments) {
                if (mode === 'bus' && seg.bus) hasMode = true;
                if (mode === 'railway' && seg.railway) hasMode = true;
            }
            if (!hasMode) continue;
            
            let duration = transit.duration ? transit.duration / 60 : Infinity;
            if (duration < bestDuration) {
                bestDuration = duration;
                best = transit;
            }
        }
        return best;
    }
    
    function parseTransitFull(transit) {
        let firstWalk = 0, lastWalk = 0;
        let totalRideSeconds = 0;
        let metroSeconds = 0, busSeconds = 0;
    
        if (transit.segments && transit.segments.length > 0) {
            const first = transit.segments[0];
            if (first.walking) firstWalk = first.walking.distance || 0;
            else if (first.bike) firstWalk = first.bike.distance || 0;
            const last = transit.segments[transit.segments.length - 1];
            if (last.walking) lastWalk = last.walking.distance || 0;
            else if (last.bike) lastWalk = last.bike.distance || 0;
    
            transit.segments.forEach(seg => {
                if (seg.bus && seg.bus.buslines && seg.bus.buslines[0]) {
                    const dur = seg.bus.buslines[0].duration || 0;
                    if (dur > 0 && dur < 86400) {
                        totalRideSeconds += dur;
                        busSeconds += dur;
                    } else {
                        const dist = seg.bus.buslines[0].distance || 0;
                        if (dist > 0) {
                            const est = (dist / 1000) * 240;
                            totalRideSeconds += est;
                            busSeconds += est;
                        }
                    }
                }
                if (seg.railway) {
                    const dur = seg.railway.duration || 0;
                    if (dur > 0 && dur < 86400) {
                        totalRideSeconds += dur;
                        metroSeconds += dur;
                    } else {
                        const dist = seg.railway.distance || 0;
                        if (dist > 0) {
                            const est = (dist / 1000) * 120;
                            totalRideSeconds += est;
                            metroSeconds += est;
                        }
                    }
                }
            });
        }
    
        return {
            firstWalk: Math.round(firstWalk),
            lastWalk: Math.round(lastWalk),
            totalRideMinutes: Math.round(totalRideSeconds / 60),
            metroMinutes: Math.round(metroSeconds / 60),
            busMinutes: Math.round(busSeconds / 60),
            transfers: transit.transfers || 0,
            cost: transit.cost ? Number(transit.cost) : 0
        };
    }
    
    function calculateDistance(lnglat1, lnglat2) {
        const R = 6371;
        const lat1 = lnglat1[1]*Math.PI/180, lat2 = lnglat2[1]*Math.PI/180;
        const dLat = (lnglat2[1]-lnglat1[1])*Math.PI/180;
        const dLng = (lnglat2[0]-lnglat1[0])*Math.PI/180;
        const a = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
    
    // ========== 主计算（优化步行距离估算） ==========
    async function calculate() {
        if (!currentStartLngLat) { alert("请先在地图上点击选择起点"); return; }
        if (isCalculating) return;
        
        isCalculating = true;
        const btn = document.getElementById('calculate-btn');
        btn.disabled = true; 
        btn.innerHTML = '<span>🔄</span><span>计算中…</span>';
        document.getElementById('results-body').innerHTML = `<tr><td colspan="6" class="loading"><div class="spinner"></div><div>调用高德API，解析真实步行距离…</div></td></tr>`;
        
        try {
            const start = currentStartLngLat;
            const end = currentEndLngLat;
            const depTime = document.getElementById('departure-time').value;
            const [hour] = depTime.split(':').map(Number);
            const direction = getTripDirection();
            
            const [drivingRes, transitRes] = await Promise.all([
                callAmapAPI('driving', { start, end }),
                callAmapAPI('transit', { start, end })
            ]);
            
            // 驾车数据
            let drivingDist = 0, drivingDur = 0;
            if (drivingRes.success && drivingRes.data.route?.paths?.length) {
                const p = drivingRes.data.route.paths[0];
                drivingDist = p.distance / 1000;
                drivingDur = p.duration / 60;
            } else {
                const straight = calculateDistance(start, end);
                drivingDist = straight * 1.3;
                drivingDur = straight * 3;
            }
            
            // ========== 获取地铁信息 ==========
            let metroInfo = {
                rideMinutes: 0,
                firstWalk: 0,
                lastWalk: 0,
                transfers: 0,
                cost: 0
            };
            let metroDistance = 0;
            
            if (transitRes.success && transitRes.data.route && transitRes.data.route.transits) {
                const transits = transitRes.data.route.transits;
                
                const pureMetro = findBestPureTransit(transits, 'railway');
                if (pureMetro) {
                    const parsed = parseTransitFull(pureMetro);
                    metroInfo = {
                        rideMinutes: parsed.totalRideMinutes,
                        firstWalk: parsed.firstWalk,
                        lastWalk: parsed.lastWalk,
                        transfers: pureMetro.transfers || 0,
                        cost: parsed.cost
                    };
                    pureMetro.segments.forEach(seg => {
                        if (seg.railway && seg.railway.distance) metroDistance += seg.railway.distance / 1000;
                    });
                    if (metroInfo.cost === 0 && metroDistance > 0) {
                        metroInfo.cost = getMetroPriceByDistance(metroDistance);
                    }
                } else {
                    const bestMixed = selectBestTransitByMode(transits, 'railway');
                    if (bestMixed) {
                        const extracted = extractModeInfo(bestMixed, 'railway');
                        if (extracted) {
                            metroInfo = extracted;
                            if (metroInfo.cost === 0) {
                                bestMixed.segments.forEach(seg => {
                                    if (seg.railway && seg.railway.distance) metroDistance += seg.railway.distance / 1000;
                                });
                                metroInfo.cost = getMetroPriceByDistance(metroDistance);
                            }
                        }
                    }
                }
                
                // 如果乘车时间异常，用直线距离估算（优化步行距离系数）
                if (metroInfo.rideMinutes > 600 || metroInfo.rideMinutes === 0) {
                    console.warn('地铁乘车时间异常，使用直线距离估算');
                    const straight = calculateDistance(start, end);
                    metroInfo.rideMinutes = Math.round(straight * 2);
                    // 优化：步行距离取直线距离的0.5倍，上限5000米
                    let estimatedWalk = Math.round(straight * 500); // 500米/公里
                    estimatedWalk = Math.min(estimatedWalk, 5000);
                    metroInfo.firstWalk = estimatedWalk;
                    metroInfo.lastWalk = estimatedWalk;
                    metroInfo.transfers = 1;
                    metroDistance = straight * 0.7;
                    metroInfo.cost = getMetroPriceByDistance(metroDistance);
                }
            } else {
                // API失败，使用直线距离估算（优化步行距离系数）
                const straight = calculateDistance(start, end);
                metroInfo.rideMinutes = Math.round(straight * 2);
                let estimatedWalk = Math.round(straight * 500);
                estimatedWalk = Math.min(estimatedWalk, 5000);
                metroInfo.firstWalk = estimatedWalk;
                metroInfo.lastWalk = estimatedWalk;
                metroInfo.transfers = 1;
                metroDistance = straight * 0.7;
                metroInfo.cost = getMetroPriceByDistance(metroDistance);
            }
            
            // ========== 获取公交信息 ==========
            let busInfo = {
                rideMinutes: 0,
                firstWalk: 0,
                lastWalk: 0,
                transfers: 0,
                cost: 0
            };
            
            if (transitRes.success && transitRes.data.route && transitRes.data.route.transits) {
                const transits = transitRes.data.route.transits;
                
                const pureBus = findBestPureTransit(transits, 'bus');
                if (pureBus) {
                    const parsed = parseTransitFull(pureBus);
                    busInfo = {
                        rideMinutes: parsed.totalRideMinutes,
                        firstWalk: parsed.firstWalk,
                        lastWalk: parsed.lastWalk,
                        transfers: pureBus.transfers || 0,
                        cost: parsed.cost
                    };
                    if (busInfo.cost === 0 && pureBus.segments) {
                        let busCount = 0;
                        pureBus.segments.forEach(seg => { if (seg.bus) busCount++; });
                        busInfo.cost = busCount * 2;
                    }
                } else {
                    const bestMixed = selectBestTransitByMode(transits, 'bus');
                    if (bestMixed) {
                        const extracted = extractModeInfo(bestMixed, 'bus');
                        if (extracted) {
                            busInfo = extracted;
                            if (busInfo.cost === 0 && bestMixed.segments) {
                                let busCount = 0;
                                bestMixed.segments.forEach(seg => { if (seg.bus) busCount++; });
                                busInfo.cost = busCount * 2;
                            }
                        }
                    }
                }
                
                if (busInfo.rideMinutes > 600 || busInfo.rideMinutes === 0) {
                    console.warn('公交乘车时间异常，使用直线距离估算');
                    const straight = calculateDistance(start, end);
                    busInfo.rideMinutes = Math.round(straight * 2.5);
                    let estimatedWalk = Math.round(straight * 500);
                    estimatedWalk = Math.min(estimatedWalk, 5000);
                    busInfo.firstWalk = estimatedWalk;
                    busInfo.lastWalk = estimatedWalk;
                    busInfo.transfers = 1;
                    busInfo.cost = 2 + busInfo.transfers;
                }
            } else {
                const straight = calculateDistance(start, end);
                busInfo.rideMinutes = Math.round(straight * 2.5);
                let estimatedWalk = Math.round(straight * 500);
                estimatedWalk = Math.min(estimatedWalk, 5000);
                busInfo.firstWalk = estimatedWalk;
                busInfo.lastWalk = estimatedWalk;
                busInfo.transfers = 1;
                busInfo.cost = 2 + busInfo.transfers;
            }
            
            // 对API返回的步行距离也进行上限限制（防止个别异常值）
            const cap = 5000; // 米（对应步行时间约60分钟）
            metroInfo.firstWalk = Math.min(cap, Math.max(0, metroInfo.firstWalk));
            metroInfo.lastWalk = Math.min(cap, Math.max(0, metroInfo.lastWalk));
            busInfo.firstWalk = Math.min(cap, Math.max(0, busInfo.firstWalk));
            busInfo.lastWalk = Math.min(cap, Math.max(0, busInfo.lastWalk));
            
            // 根据方向确定最终用于表格的步行距离（米）
            const metroWalkDist = (direction === 'to-hub') ? metroInfo.firstWalk : metroInfo.lastWalk;
            const busWalkDist = (direction === 'to-hub') ? busInfo.firstWalk : busInfo.lastWalk;
            
            // 缓存进站时的步行距离（用于离站时对称）
            if (direction === 'to-hub') {
                lastExternalLngLat = start;
                lastMetroWalkDist = metroWalkDist;
                lastBusWalkDist = busWalkDist;
            }
            
            // 生成所有交通方式数据
            const transportData = generateTransportData({
                drivingDist, drivingDur,
                metroFirstWalk: metroInfo.firstWalk,
                metroLastWalk: metroInfo.lastWalk,
                metroWalkDist,               // 米
                metroRide: metroInfo.rideMinutes,
                metroTransfers: metroInfo.transfers,
                metroPrice: metroInfo.cost,
                busWalkDist,                 // 米
                busRide: busInfo.rideMinutes,
                busTransfers: busInfo.transfers,
                busPrice: busInfo.cost,
                hour,
                direction
            });
            
            updateDisplay(transportData);
            updateStatus('计算完成', 'success');
            
        } catch (e) {
            console.error('计算异常:', e);
            document.getElementById('results-body').innerHTML = `<tr><td colspan="6" style="color:#dc3545; padding:40px;">❌ 计算异常: ${e.message}</td></tr>`;
            updateStatus('计算失败', 'error');
        } finally {
            btn.disabled = false; 
            btn.innerHTML = '<span>🚀</span><span>开始计算对比</span>';
            isCalculating = false;
        }
    }
    
    // ========== 将步行距离（米）转换为步行时间（分钟），保留一位小数 ==========
    function walkDistToTime(distMeters) {
        const speed = 83.3333; // 5 km/h = 83.3333 米/分钟
        const timeMin = distMeters / speed;
        return timeMin.toFixed(1) + '分钟';
    }
    
    // ========== 生成所有交通方式数据 ==========
    function generateTransportData({ drivingDist, drivingDur, metroFirstWalk, metroLastWalk, metroWalkDist, metroRide, metroTransfers, metroPrice, busWalkDist, busRide, busTransfers, busPrice, hour, direction }) {
        
        const baseMetroPrice = Number(metroPrice) || 0;
        const baseBusPrice = Number(busPrice) || 0;
        
        const taxiWalkTime = walkDistToTime(200);
        const rideHailWalkTime = walkDistToTime(200);
        const bikeWalkTime = walkDistToTime(100);
        const privateWalkTime = "-";  // 私家车步行时间固定为横杠
        
        const metroWalkTime = walkDistToTime(metroWalkDist);
        const busWalkTime = walkDistToTime(busWalkDist);
        
        const taxiRide = Math.round(drivingDur);
        const rideHailRide = Math.round(drivingDur * 0.95);
        const privateRide = Math.round(drivingDur * 0.9);
        const bikeRide = drivingDist <= 8 ? Math.round(drivingDist * 4) : null;
        
        let metroBikeWalkTime, metroBikeRide, metroBikeCost, metroBikeTransfer;
        let metroTaxiWalkTime, metroTaxiRide, metroTaxiCost, metroTaxiTransfer;
        let metroRideWalkTime, metroRideHailRide, metroRideCost, metroRideHailTransfer;
        
        const BIKE_SPEED = 4;      // 共享单车速度（分钟/公里）
        const TAXI_SPEED = 2;      // 出租车/网约车速度（分钟/公里）
        
        if (direction === 'to-hub') {
            const secondDist = metroLastWalk / 1000;
            const bikeSecondTime = Math.round(secondDist * BIKE_SPEED);
            const taxiSecondTime = Math.round(secondDist * TAXI_SPEED);
            const rideSecondTime = taxiSecondTime;
            
            const bikeSecondPrice = calculateBikePrice(secondDist);
            const taxiSecondPrice = calculateTaxiPrice(secondDist, hour);
            const rideSecondPrice = Math.round(taxiSecondPrice * 0.85);
            
            metroBikeWalkTime = walkDistToTime(metroFirstWalk);
            metroBikeRide = (metroRide + bikeSecondTime) + '分钟';
            const bikeExtra = (bikeSecondPrice !== '-') ? parseFloat(bikeSecondPrice) : 0;
            metroBikeCost = (baseMetroPrice + bikeExtra).toFixed(1) + '元';
            
            metroTaxiWalkTime = walkDistToTime(metroFirstWalk);
            metroTaxiRide = (metroRide + taxiSecondTime) + '分钟';
            metroTaxiCost = (baseMetroPrice + taxiSecondPrice) + '元';
            
            metroRideWalkTime = walkDistToTime(metroFirstWalk);
            metroRideHailRide = (metroRide + rideSecondTime) + '分钟';
            metroRideCost = (baseMetroPrice + rideSecondPrice) + '元';
            
            metroBikeTransfer = metroTransfers + 1;
            metroTaxiTransfer = metroTransfers + 1;
            metroRideHailTransfer = metroTransfers + 1;
        } else {
            const secondDist = metroFirstWalk / 1000;
            const bikeSecondTime = Math.round(secondDist * BIKE_SPEED);
            const taxiSecondTime = Math.round(secondDist * TAXI_SPEED);
            const rideSecondTime = taxiSecondTime;
            
            const bikeSecondPrice = calculateBikePrice(secondDist);
            const taxiSecondPrice = calculateTaxiPrice(secondDist, hour);
            const rideSecondPrice = Math.round(taxiSecondPrice * 0.85);
            
            metroBikeWalkTime = walkDistToTime(metroLastWalk);
            metroBikeRide = (metroRide + bikeSecondTime) + '分钟';
            const bikeExtra = (bikeSecondPrice !== '-') ? parseFloat(bikeSecondPrice) : 0;
            metroBikeCost = (baseMetroPrice + bikeExtra).toFixed(1) + '元';
            
            metroTaxiWalkTime = walkDistToTime(metroLastWalk);
            metroTaxiRide = (metroRide + taxiSecondTime) + '分钟';
            metroTaxiCost = (baseMetroPrice + taxiSecondPrice) + '元';
            
            metroRideWalkTime = walkDistToTime(metroLastWalk);
            metroRideHailRide = (metroRide + rideSecondTime) + '分钟';
            metroRideCost = (baseMetroPrice + rideSecondPrice) + '元';
            
            metroBikeTransfer = metroTransfers + 1;
            metroTaxiTransfer = metroTransfers + 1;
            metroRideHailTransfer = metroTransfers + 1;
        }
        
        const taxiPrice = calculateTaxiPrice(drivingDist, hour);
        const ridePrice = Math.round(taxiPrice * 0.85);
        const privatePrice = Math.round(drivingDist * 0.8 + (currentDestination==='airport'?20:15));
        const bikePrice = calculateBikePrice(drivingDist);
        
        return {
            "出租车": {
                wait: getWaitTime('出租车', hour),
                walkTime: taxiWalkTime,
                rideTime: taxiRide + '分钟',
                transfer: 0,
                cost: taxiPrice + '元'
            },
            "网约车": {
                wait: getWaitTime('网约车', hour),
                walkTime: rideHailWalkTime,
                rideTime: rideHailRide + '分钟',
                transfer: 0,
                cost: ridePrice + '元'
            },
            "私家车": {
                wait: getWaitTime('私家车', hour),
                walkTime: privateWalkTime,  // 确保为横杠
                rideTime: privateRide + '分钟',
                transfer: 0,
                cost: privatePrice + '元'
            },
            "地铁": {
                wait: getWaitTime('地铁', hour),
                walkTime: metroWalkTime,
                rideTime: metroRide + '分钟',
                transfer: metroTransfers,
                cost: baseMetroPrice + '元'
            },
            "公交车": {
                wait: getWaitTime('公交车', hour),
                walkTime: busWalkTime,
                rideTime: busRide + '分钟',
                transfer: busTransfers,
                cost: baseBusPrice + '元'
            },
            "共享单车": {
                wait: getWaitTime('共享单车', hour),
                walkTime: bikeWalkTime,
                rideTime: bikeRide ? bikeRide+'分钟' : '不建议骑行',
                transfer: 0,
                cost: bikePrice === '-' ? '-' : bikePrice + '元'
            },
            "地铁+共享单车": {
                wait: getWaitTime('地铁', hour),
                walkTime: metroBikeWalkTime,
                rideTime: metroBikeRide,
                transfer: metroBikeTransfer,
                cost: metroBikeCost
            },
            "地铁+出租车": {
                wait: getWaitTime('地铁', hour),
                walkTime: metroTaxiWalkTime,
                rideTime: metroTaxiRide,
                transfer: metroTaxiTransfer,
                cost: metroTaxiCost
            },
            "地铁+网约车": {
                wait: getWaitTime('地铁', hour),
                walkTime: metroRideWalkTime,
                rideTime: metroRideHailRide,
                transfer: metroRideHailTransfer,
                cost: metroRideCost
            }
        };
    }
    
    function getWaitTime(mode, hour) {
        if (mode === '私家车') return '0分钟';
        let base = 0;
        switch(mode) {
            case '出租车': base = 5; break;
            case '网约车': base = 6; break;
            case '地铁': base = 4; break;
            case '公交车': base = 10; break;
            case '共享单车': base = 1; break;
            default: if (mode.includes('地铁')) base = 4; else base = 5;
        }
        if (hour >= 7 && hour < 9) {
            if (mode === '地铁') base += 0;
            else if (mode === '公交车') base += 3;
            else base += 2;
        } else if (hour >= 17 && hour < 19) {
            if (mode === '地铁') base += 0;
            else if (mode === '公交车') base += 3;
            else base += 2;
        } else if (hour >= 22 || hour < 6) {
            if (mode === '地铁') base += 6;
            else if (mode === '公交车') base += 15;
            else if (mode === '出租车' || mode === '网约车') base += 5;
            else base += 3;
        } else {
            if (mode === '地铁') base += 1;
            else if (mode === '公交车') base += 2;
        }
        let wait = base + (Math.random() * 2 - 1);
        wait = Math.max(1, Math.round(wait));
        return wait + '分钟';
    }
    
    function updateDisplay(data) {
        const tbody = document.getElementById('results-body');
        tbody.innerHTML = '';
        
        const allModes = ["出租车","网约车","私家车","地铁","公交车","共享单车","地铁+共享单车","地铁+出租车","地铁+网约车"];
        const icons = {
            "出租车":"🚕","网约车":"🚗","私家车":"🚙","地铁":"🚇","公交车":"🚌","共享单车":"🚲",
            "地铁+共享单车":"🚇+🚲","地铁+出租车":"🚇+🚕","地铁+网约车":"🚇+🚗"
        };
        
        allModes.forEach(mode => {
            if (data[mode]) {
                const d = data[mode];
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td style="font-weight: bold; text-align: left;"><span class="transport-icon">${icons[mode]}</span>${mode}</td>
                    <td>${d.wait}</td>
                    <td style="color: #e67e22; font-weight: 500;">${d.walkTime}</td>
                    <td style="color: #007bff; font-weight: 500;">${d.rideTime}</td>
                    <td>${d.transfer}</td>
                    <td style="color: #28a745; font-weight: 500;">${d.cost}</td>
                `;
                tbody.appendChild(row);
            }
        });
    }
    
    window.onload = function() {
        updateStatus('初始化地图…');
        if (typeof AMap !== 'undefined') {
            setTimeout(() => initMap(), 500);
        } else {
            window.addEventListener('load', () => setTimeout(initMap, 800));
        }
        document.getElementById('departure-time').addEventListener('change', function() {
            if (currentStartLngLat) calculate();
        });
        document.querySelectorAll('input[name="trip-direction"]').forEach(radio => {
            radio.addEventListener('change', function() {
                if (currentStartLngLat) calculate();
            });
        });
    };
</script>
